name: Deploy Quartz Blog to GitHub Pages

on:
  push:
    branches:
      - main
      - v5
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Tự động đồng bộ mỗi 6 tiếng (4 lần/ngày)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Blog & Sync Vault
        run: npm run build

      - name: Commit Synced Changes (if any)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain content quartz/static)" ]; then
            git add content/ quartz/static/
            git commit -m "chore(auto-sync): update notes from vault [skip ci]"
            git push origin main || echo "Push skipped or already updated"
          else
            echo "No new changes detected from vault."
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
